name: Build APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} APKs
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RootlessFull
            gradle_variant: RootlessFull
            output_flavor: rootlessFull
            branch_build_type: Preview
            tag_build_type: Release
          - name: RootlessFdroid
            gradle_variant: RootlessFdroid
            output_flavor: rootlessFdroid
            branch_build_type: Release
            tag_build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_NAME="$(sed -nE 's/^[[:space:]]*const val versionName = "([^"]+)".*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)"
          if [[ -z "$APP_VERSION_NAME" ]]; then
            echo "Could not read the app version from AndroidConfig.kt."
            exit 1
          fi
          EXPECTED_TAG="v${APP_VERSION_NAME}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Select build type
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_TYPE="${{ matrix.tag_build_type }}"
          else
            BUILD_TYPE="${{ matrix.branch_build_type }}"
          fi
          OUTPUT_TYPE="$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')"
          echo "GRADLE_TASK=:app:assemble${{ matrix.gradle_variant }}${BUILD_TYPE}" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=app/build/outputs/apk/${{ matrix.output_flavor }}/${OUTPUT_TYPE}" >> "$GITHUB_ENV"
          echo "OUTPUT_TYPE=${OUTPUT_TYPE}" >> "$GITHUB_ENV"

      - name: Configure release signing
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || matrix.branch_build_type == 'Release')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APKs
        run: ./gradlew "${{ env.GRADLE_TASK }}"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}JamesDSP-${{ env.OUTPUT_TYPE }}-apks
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-apks
          merge-multiple: true

      - name: Verify release APKs
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_NAME="$(sed -nE 's/^[[:space:]]*const val versionName = "([^"]+)".*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)"
          APP_VERSION_CODE="$(sed -nE 's/^[[:space:]]*const val versionCode = ([0-9]+).*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)"
          for flavor in rootless-full rootless-fdroid; do
            for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
              apk="release-apks/SiphonDSP-v${APP_VERSION_NAME}-${APP_VERSION_CODE}-${flavor}-${abi}-release.apk"
              if [[ ! -f "$apk" ]]; then
                echo "Missing expected release APK: $apk"
                exit 1
              fi
            done
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: SiphonDSP ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk

      - name: Verify uploaded APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_NAME="$(sed -nE 's/^[[:space:]]*const val versionName = "([^"]+)".*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)"
          APP_VERSION_CODE="$(sed -nE 's/^[[:space:]]*const val versionCode = ([0-9]+).*/\1/p' buildSrc/src/main/kotlin/AndroidConfig.kt)"
          UPLOADED_ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[].name')"
          for flavor in rootless-full rootless-fdroid; do
            for abi in armeabi-v7a arm64-v8a x86 x86_64 universal; do
              apk="SiphonDSP-v${APP_VERSION_NAME}-${APP_VERSION_CODE}-${flavor}-${abi}-release.apk"
              if ! grep -Fqx -- "$apk" <<< "$UPLOADED_ASSETS"; then
                echo "GitHub release is missing APK asset: $apk"
                exit 1
              fi
            done
          done
